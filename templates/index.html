<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ hostname }} HUB</title>
    <style>
        :root {
            --bg-color: #0a192f;
            --card-bg: #112240;
            --card-hover: #1d3557;
            --text-primary: #e6f1ff;
            --text-secondary: #8892b0;
            --accent: #64ffda;
            --border: #233554;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header p {
            color: var(--accent);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s cubic-bezier(0.645, 0.045, 0.355, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            background-color: var(--card-hover);
            border-color: var(--accent);
            box-shadow: 0 10px 30px -15px rgba(2, 12, 27, 0.7);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-port {
            font-size: 0.75rem;
            font-family: monospace;
            background-color: rgba(100, 255, 218, 0.1);
            color: var(--accent);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>{{ hostname }} Hub</h1>
        <p>● Live Services</p>
    </header>

    <div class="grid-container" id="services-grid">
        <!-- A csempék dinamikusan töltődnek be -->
    </div>

    <script>
        let currentHash = "";

        async function fetchServices() {
            try {
                const response = await fetch('/api/services');
                const data = await response.json();
                
                const dataString = JSON.stringify(data);
                if (dataString === currentHash) return;
                currentHash = dataString;

                const grid = document.getElementById('services-grid');
                grid.innerHTML = '';

                data.forEach(service => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    
                    let url = service.ip;
                    if (service.port) {
                        if (url.endsWith('/')) url = url.slice(0, -1);
                        url = `${url}:${service.port}`;
                    }
                    
                    card.href = url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';

                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <div class="card-title">${service.name}</div>
                                ${service.port ? `<div class="card-port">:${service.port}</div>` : ''}
                            </div>
                            <div class="card-desc">${service.description || ''}</div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Hiba a szolgáltatások frissítésekor:", err);
            }
        }

        fetchServices();
        setInterval(fetchServices, 5000);
    </script>
</body>
</html>
